<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>RETRO SHIFT</title>
    <meta name="description" content="A neon wireframe racer through two overlapping worlds. Shift between BOTH, RED only and BLUE only to change the track, its shortcuts and its obstacles." />
    <meta name="theme-color" content="#05020c" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Russo+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/game.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="hud" hidden></div>
      <div id="ui"></div>
      <div id="touch" hidden></div>
      <div id="loader"><div class="logo"><span class="retro">RETRO</span><span class="shift">SHIFT</span></div><p>Drawing two worlds…</p></div>
      <noscript><p class="noscript">RETRO SHIFT needs JavaScript and WebGL.</p></noscript>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
