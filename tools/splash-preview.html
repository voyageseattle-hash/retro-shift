<!doctype html>
<!-- Offline preview of the studio card's sound, then the hand-over into the title song and shout. -->
<meta charset="utf-8" />
<title>RETRO SHIFT splash preview</title>
<script type="module">
  import { Audio } from '../js/core/audio.js';
  import { SONGS } from '../js/core/songs.js';
  const SR = 44100;
  window.renderVoice = async (seconds, cues) => {
    const ctx = new OfflineAudioContext(2, Math.ceil(SR * seconds), SR);
    const a = new Audio();
    a.musicVolume = 0.55;
    a.sfxVolume = 1;
    a.build(ctx);
    a.clock = 0;
    a.voice = new Map();
    for (const id of []) {
      const b = await (await fetch(`../audio/voice/${id}.mp3`)).arrayBuffer();
      a.voice.set(id, await ctx.decodeAudioData(b));
    }
    a.voice.set('title', await ctx.decodeAudioData(await (await fetch('../audio/voice/title.mp3')).arrayBuffer()));
    a.splashIntro(0.05);
    const H = cues;
    ctx.suspend(H).then(() => { a.clock = H; a.splashSting(); a.playSong(SONGS.title); a.schedule(a.song, H + 0.7); a.titleShout(0.45); ctx.resume(); });
    for (let t = H + 0.5; t < seconds; t += 0.5) ctx.suspend(t).then(() => { a.clock = t; a.schedule(a.song, t + 0.7); ctx.resume(); });
    const buf = await ctx.startRendering();
    const n = buf.length, L = buf.getChannelData(0), R = buf.getChannelData(1);
    const out = new DataView(new ArrayBuffer(44 + n * 4));
    const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
    out.setUint32(24, SR, true); out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * 4, true);
    for (let i = 0, o = 44; i < n; i++, o += 4) { out.setInt16(o, Math.max(-1, Math.min(1, L[i])) * 32767, true); out.setInt16(o + 2, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
    const bytes = new Uint8Array(out.buffer); let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  };
  window.ready = true;
</script>
